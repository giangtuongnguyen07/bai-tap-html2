<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản mới - ShopVN</title>
</head>
<body>

    <main>
        <section>
            <h2>Đăng ký tài khoản mới</h2>

            <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
                
                <fieldset>
                    <legend>Thông tin cơ bản</legend>
                    
                    <label for="hoten">Họ và tên:</label>
                    <input type="text" name="hoten" id="hoten" placeholder="" required maxlength="100"><br><br>

                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="" required><br><br>

                    <label for="matkhau">Mật khẩu:</label>
                    <input type="password" name="matkhau" id="matkhau" minlength="8" required><br><br>

                    <label for="sdt">Số điện thoại:</label>
                    <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder=""><br><br>
                </fieldset>

                <fieldset>
                    <legend>Thông tin cá nhân</legend>

                    <label for="tuoi">Tuổi:</label>
                    <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value=""><br><br>

                    <label for="ngaysinh">Ngày sinh:</label>
                    <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31"><br><br>

                    <label>Giới tính:</label>
                    <input type="radio" name="gioitinh" value="nam"> Nam
                    <input type="radio" name="gioitinh" value="nu"> Nữ
                    <input type="radio" name="gioitinh" value="khac"> Khác<br><br>

                    <label for="mauaa">Màu yêu thích:</label>
                    <input type="color" name="mauaa" id="mauaa" value="#FF6B6B"><br><br>
                </fieldset>

                <fieldset>
                    <legend>Sở thích & Cài đặt</legend>

                    <label>Sở thích (chọn nhiều):</label>
                    <input type="checkbox" name="st_docsinh" value="doc"> Đọc sách
                    <input type="checkbox" name="st_game" value="game"> Chơi game
                    <input type="checkbox" name="st_du_lich" value="dulich"> Du lịch<br><br>

                    <label for="chitieu">Mức chi tiêu/tháng (VND):</label>
                    <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000"><br><br>

                    <label for="website">Website cá nhân:</label>
                    <input type="url" name="website" id="website" placeholder=""><br><br>

                    <label for="soikim">Tìm kiếm sở thích:</label>
                    <input type="search" name="soikim" id="soikim" placeholder=""><br><br>

                    <label for="avatar">Ảnh đại diện:</label>
                    <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg"><br><br>
                </fieldset>

                <br>
                <input type="submit" value="Đăng ký ngay">
                <input type="reset" value="Nhập lại">

            </form>
        </section>
    </main>

</body>
</html>
