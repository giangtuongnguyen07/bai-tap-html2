<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - ShopVN</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0fdf4; margin: 0; padding: 20px; }
        main { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #15803d; margin-top: 0; }
        fieldset { border: 1px solid #bbf7d0; background-color: #f0fdf4; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        legend { font-weight: bold; color: #166534; padding: 0 8px; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; }
        .form-group label { width: 180px; font-size: 14px; font-weight: 500; }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="tel"],
        .form-group input[type="url"],
        .form-group input[type="number"],
        .form-group input[type="date"],
        .form-group input[type="search"],
        .form-group input[type="file"] { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .btn-container { text-align: center; margin-top: 15px; }
        button, input[type="submit"], input[type="reset"] { padding: 8px 20px; margin: 0 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input[type="submit"] { background-color: #2563eb; color: white; }
        input[type="reset"] { background-color: #64748b; color: white; }
    </style>
</head>
<body>
    <main>
        <section>
            <h2>Đăng ký tài khoản mới</h2>
            <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
                
                <fieldset>
                    <legend>Thông tin cơ bản</legend>
                    <div class="form-group">
                        <label for="hoten">Họ và tên:</label>
                        <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="matkhau">Mật khẩu:</label>
                        <input type="password" name="matkhau" id="matkhau" minlength="8" required>
                    </div>
                    <div class="form-group">
                        <label for="sdt">Số điện thoại:</label>
                        <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Thông tin cá nhân</legend>
                    <div class="form-group">
                        <label for="tuoi">Tuổi:</label>
                        <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18">
                    </div>
                    <div class="form-group">
                        <label for="ngaysinh">Ngày sinh:</label>
                        <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31">
                    </div>
                    <div class="form-group">
                        <label>Giới tính:</label>
                        <input type="radio" name="gioitinh" id="nam" value="nam"> <label for="nam" style="width:auto; margin-right:10px;">Nam</label>
                        <input type="radio" name="gioitinh" id="nu" value="nu"> <label for="nu" style="width:auto; margin-right:10px;">Nữ</label>
                        <input type="radio" name="gioitinh" id="khac" value="khac"> <label for="khac" style="width:auto;">Khác</label>
                    </div>
                    <div class="form-group">
                        <label for="mauaa">Màu yêu thích:</label>
                        <input type="color" name="mauaa" id="mauaa" value="#FF6B6B">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Sở thích & Cài đặt</legend>
                    <div class="form-group">
                        <label for="soikim">Tìm kiếm sở thích:</label>
                        <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game...">
                    </div>
                    <div class="form-group">
                        <label>Sở thích (chọn nhiều):</label>
                        <input type="checkbox" name="st_docsinh" id="st_docsinh" value="doc"> <label for="st_docsinh" style="width:auto; margin-right:10px;">Đọc sách</label>
                        <input type="checkbox" name="st_game" id="st_game" value="game"> <label for="st_game" style="width:auto; margin-right:10px;">Chơi game</label>
                        <input type="checkbox" name="st_du_lich" id="st_du_lich" value="dulich"> <label for="st_du_lich" style="width:auto;">Du lịch</label>
                    </div>
                    <div class="form-group">
                        <label for="chitieu">Mức chi tiêu/tháng (VND):</label>
                        <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000">
                    </div>
                    <div class="form-group">
                        <label for="website">Website cá nhân:</label>
                        <input type="url" name="website" id="website" placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label for="avatar">Ảnh đại diện:</label>
                        <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg">
                    </div>
                </fieldset>

                <div class="btn-container">
                    <input type="submit" value="Đăng ký ngay">
                    <input type="reset" value="Nhập lại">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
